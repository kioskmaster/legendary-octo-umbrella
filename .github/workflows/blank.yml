name: Proxmox Runner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proxmox:
    runs-on: machine/cpu=16/tenancy=spot

    steps:
      - uses: actions/checkout@v4

      - name: Run Proxmox + persistent SSH tunnel with logs
        run: |
          # Start Proxmox container
          docker run -it --rm \
            --name proxmox \
            --hostname pve \
            --privileged \
            -e "PASSWORD=icyBe@r92" \
            -p 8006:8006 \
            -v "${PWD:-.}/data:/var/lib/vz" \
            -v "${PWD:-.}/config:/var/lib/pve-cluster" \
            --stop-timeout 120 \
            docker.io/dockurr/proxmox &

          echo "[INFO] Proxmox container started"

          # Start infinite SSH reverse tunnel loop
          while true; do
              echo "[INFO] Starting SSH reverse tunnel..."
              ssh -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o LogLevel=ERROR \
                  -p 223 \
                  -l HY8T6RYjPGsvjnNN5dDZj5txNiqOXGUXwAuZBq6fGq706B3vqImtfVuCwl0MDeyzC-xTumIdlRVm0IbChuDqpw \
                  mwetadcswn.localto.net \
                  -R2983:127.0.0.1:8006

              echo "[WARN] SSH tunnel dropped. Reconnecting in 10 seconds..."
              sleep 10
          done &

          echo "[INFO] SSH tunnel loop running in background"

          # Keep job alive for 1 hour
          sleep 3600
          echo "[INFO] 1 hour passed"

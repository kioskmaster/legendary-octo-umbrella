name: Proxmox Runner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proxmox:
    runs-on: machine/cpu=16/tenancy=spot

    steps:
      - uses: actions/checkout@v4

      - name: Run Proxmox + Pinggy Tunnel
        run: |
          echo "[INFO] Starting Proxmox container..."
          docker run -it --rm \
            --name proxmox \
            --hostname pve \
            --privileged \
            -e "PASSWORD=icyBe@r92" \
            -p 8006:8006 \
            -v "${PWD:-.}/data:/var/lib/vz" \
            -v "${PWD:-.}/config:/var/lib/pve-cluster" \
            --stop-timeout 120 \
            docker.io/dockurr/proxmox &

          echo "[INFO] Proxmox container started"

          echo "[INFO] Starting Pinggy reverse tunnel..."
          ssh -p 443 \
              -R0:localhost:8006 \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              Z8Lyt41EAMb@free.pinggy.io &

          echo "[INFO] Pinggy tunnel running in background"

          echo "[INFO] Keeping workflow alive for 1 hour..."
          sleep 3600

          echo "[INFO] Workflow finished"

name: Proxmox Runner
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proxmox:
    runs-on: machine/cpu=16/tenancy=spot

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH + Run Proxmox + Pinggy TCP Tunnel
        run: |
          echo "[INFO] Installing SSH client..."
          sudo apt-get update
          sudo apt-get install -y openssh-client

          echo "[INFO] Starting Proxmox container..."
          docker run -it --rm \
            --name proxmox \
            --hostname pve \
            --privileged \
            -e "PASSWORD=icyBe@r92" \
            -p 8006:8006 \
            -v "${PWD:-.}/data:/var/lib/vz" \
            -v "${PWD:-.}/config:/var/lib/pve-cluster" \
            --stop-timeout 120 \
            docker.io/dockurr/proxmox &

          echo "[INFO] Proxmox container started"

          echo "[INFO] Starting Pinggy TCP tunnel..."
          ssh -p 443 \
              -R0:127.0.0.1:22 \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -t \
              Z8Lyt41EAMb+tcp@free.pinggy.io \
              x:localServerTls:localhost &

          echo "[INFO] Pinggy TCP tunnel running in background"

          echo "[INFO] Keeping workflow alive for 1 hour..."
          sleep 3600

          echo "[INFO] Workflow finished"
